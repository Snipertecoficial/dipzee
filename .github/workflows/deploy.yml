name: Deploy to VPS

# Build the images IN CI, push them to GHCR, then have the VPS only PULL and
# run them. The VPS never builds — react-scripts `yarn build` is memory-heavy
# and OOMs on the small shared host, which is what intermittently broke the old
# `docker compose up -d --build` deploys. This is the standard build-once /
# deploy-many pipeline. Manual "Run workflow" button (workflow_dispatch) allows
# an on-demand redeploy without an empty commit.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

concurrency:
  group: dipzee-production-deploy
  cancel-in-progress: false

env:
  BACKEND_IMAGE: ghcr.io/snipertecoficial/dipzee-backend
  FRONTEND_IMAGE: ghcr.io/snipertecoficial/dipzee-frontend

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      # --- Backend: build, then run the test suite INSIDE the built image
      # (dummy env vars — the tests mock Mongo/Stripe and never connect out), so
      # a red test blocks the deploy. Only push after tests pass. ---
      - name: Build backend image
        run: docker build --build-arg GIT_SHA="${{ github.sha }}" -t "$BACKEND_IMAGE:${{ github.sha }}" -t "$BACKEND_IMAGE:latest" ./backend

      - name: Run backend tests
        run: |
          docker run --rm \
            -e MONGO_URL=mongodb://localhost:27017 \
            -e DB_NAME=ci_test \
            -e JWT_SECRET=ci-test-secret \
            "$BACKEND_IMAGE:${{ github.sha }}" \
            python -m pytest tests/ -q

      - name: Audit installed backend dependencies
        run: |
          docker run --rm "$BACKEND_IMAGE:${{ github.sha }}" \
            sh -c "pip install --no-cache-dir pip-audit==2.10.1 >/dev/null && python -m pip_audit -r requirements.txt"

      - name: Push backend image
        run: docker push --all-tags "$BACKEND_IMAGE"

      # --- Frontend: the API URL is compile-time (baked into the JS bundle), so
      # CI must build with the real production URL, not a dummy. ---
      - name: Build and test frontend image
        run: |
          docker build \
            --target build \
            --build-arg REACT_APP_BACKEND_URL="${{ vars.REACT_APP_BACKEND_URL || 'https://dipzee.com' }}" \
            -t dipzee-frontend-test:${{ github.sha }} ./frontend
          docker run --rm dipzee-frontend-test:${{ github.sha }} yarn test:ci
          docker run --rm dipzee-frontend-test:${{ github.sha }} yarn audit:ci

      - name: Build & push frontend runtime image
        run: |
          docker build \
            --build-arg REACT_APP_BACKEND_URL="${{ vars.REACT_APP_BACKEND_URL || 'https://dipzee.com' }}" \
            -t "$FRONTEND_IMAGE:${{ github.sha }}" -t "$FRONTEND_IMAGE:latest" ./frontend
          docker push --all-tags "$FRONTEND_IMAGE"

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: production
    steps:
      # --- Deploy over SSH (plain OpenSSH, no third-party action — this step
      # touches production credentials). The VPS pulls the pre-built images and
      # runs them via the prod override; it never builds. GHCR auth uses the
      # ephemeral GITHUB_TOKEN (valid only for this run), so no long-lived
      # registry token lives on the VPS. ---
      - name: Deploy over SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_SSH_PORT: ${{ secrets.VPS_SSH_PORT }}
          VPS_DEPLOY_PATH: ${{ secrets.VPS_DEPLOY_PATH }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          install -m 600 -D /dev/null ~/.ssh/deploy_key
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          install -m 600 -D /dev/null ~/.ssh/known_hosts
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts

          ssh -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -i ~/.ssh/deploy_key -p "${VPS_SSH_PORT:-22}" "$VPS_USER@$VPS_HOST" \
            "cd '$VPS_DEPLOY_PATH' && \
             git fetch origin main && \
             git reset --hard origin/main && \
             for key in JWT_SECRET PUBLIC_APP_URL CORS_ORIGINS APP_ENCRYPTION_KEY ADMIN_MFA_REQUIRED DATASET_SALT RESEND_API_KEY STRIPE_API_KEY STRIPE_PUBLISHABLE_KEY STRIPE_WEBHOOK_SECRET SUPERADMIN_EMAIL SUPERADMIN_PASSWORD BACKUP_ENCRYPTION_KEY BACKUP_S3_BUCKET BACKUP_S3_ACCESS_KEY BACKUP_S3_SECRET_KEY; do \
               grep -Eq \"^\${key}=.+\" .env || { echo \"Missing required production setting: \${key}\"; exit 1; }; \
             done && \
             previous_image=\$(docker inspect --format='{{.Config.Image}}' \$(docker compose -f docker-compose.yml -f docker-compose.prod.yml ps -q backend) 2>/dev/null || true) && \
             previous_tag=\${previous_image##*:} && \
             printf '%s' '$GHCR_TOKEN' | docker login ghcr.io -u '$GHCR_USER' --password-stdin && \
             IMAGE_TAG='${{ github.sha }}' docker compose -f docker-compose.yml -f docker-compose.prod.yml pull && \
             IMAGE_TAG='${{ github.sha }}' docker compose -f docker-compose.yml -f docker-compose.prod.yml run --rm --no-deps backend \
               python -c \"import asyncio; from backup_service import create_backup; result=asyncio.run(create_backup()); assert result.get('offsite'), 'offsite backup is required before deploy'\" && \
             if ! IMAGE_TAG='${{ github.sha }}' docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --wait --wait-timeout 180; then \
               echo 'New release failed readiness checks; rolling back containers.'; \
               test -n \"\$previous_tag\" && IMAGE_TAG=\"\$previous_tag\" docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --wait --wait-timeout 180; \
               exit 1; \
             fi && \
             docker logout ghcr.io && \
             docker image prune -f"

      # --- Post-deploy verification: prove the live site actually answers, not
      # just that the container process started. ---
      - name: Verify deployment is live
        env:
          HEALTHCHECK_URL: ${{ secrets.HEALTHCHECK_URL }}
          EXPECTED_COMMIT: ${{ github.sha }}
        run: |
          for i in $(seq 1 15); do
            status=$(curl -s -o /tmp/health.json -w '%{http_code}' "$HEALTHCHECK_URL" || echo "000")
            if [ "$status" = "200" ] && jq -e --arg sha "$EXPECTED_COMMIT" '.status == "ok" and .commit == $sha' /tmp/health.json > /dev/null 2>&1; then
              echo "Healthy after attempt $i."
              exit 0
            fi
            echo "Attempt $i/15: HTTP $status, not healthy yet — retrying in 5s..."
            sleep 5
          done
          echo "Deployment did not become healthy in time. Last response:"
          cat /tmp/health.json 2>/dev/null || echo "(no response body)"
          exit 1
